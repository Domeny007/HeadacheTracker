name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  swiftlint:
    runs-on: macos-latest

    steps:

      - &checkout
        name: Checkout
        uses: actions/checkout@v7

      - &cache_spm
        name: Cache SPM
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-v1-${{ hashFiles('**/Package.resolved') }}

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HeadacheTracker.xcodeproj \
            -scheme HeadacheTracker \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: SwiftLint
        run: |
          SWIFTLINT_DIR="$RUNNER_TEMP/SourcePackages/artifacts/swiftlintplugins/SwiftLintBinary"
          "$SWIFTLINT_DIR/SwiftLintBinary.artifactbundle/macos/swiftlint" lint \
            --config .swiftlint.yml \
            --reporter github-actions-logging

  unit_tests:
    runs-on: macos-latest
    needs: swiftlint

    steps:

      - *checkout

      - &setup_ruby
        name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          rubygems: '4.1.0'
          bundler-cache: true

      - *cache_spm

      - name: Build for testing
        run: bundle exec fastlane build_for_tests

      - name: Unit Tests
        run: bundle exec fastlane unit_tests

      - name: Package test products
        run: |
            tar -czf "$RUNNER_TEMP/test-products.tar.gz" \
            -C "$RUNNER_TEMP/DerivedData/Build" \
            Products

      - name: Upload test products
        uses: actions/upload-artifact@v7
        with:
          name: test-products
          path: ${{ runner.temp }}/test-products.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  ui_tests:
    runs-on: macos-latest
    needs: unit_tests

    steps:

      - *checkout
      - *setup_ruby


      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: ${{ runner.temp }}

      - name: Unpack test products
        run: |
            mkdir -p "$RUNNER_TEMP/DerivedData/Build"
            tar -xzf "$RUNNER_TEMP/test-products.tar.gz" \
            -C "$RUNNER_TEMP/DerivedData/Build"

      - name: UI Tests
        run: bundle exec fastlane ui_tests
