name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  swiftlint:
    runs-on: macos-latest

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7

      - &cache_spm
        name: Cache SPM
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-v1-${{ hashFiles('**/Package.resolved') }}

      - &resolve_packages
        name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HeadacheTracker.xcodeproj \
            -scheme HeadacheTracker \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: SwiftLint
        run: |
          SWIFTLINT_DIR="$RUNNER_TEMP/SourcePackages/artifacts/swiftlintplugins/SwiftLintBinary"
          "$SWIFTLINT_DIR/SwiftLintBinary.artifactbundle/macos/swiftlint" lint \
            --config .swiftlint.yml \
            --reporter github-actions-logging
  unit_tests:
    runs-on: macos-latest
    needs: swiftlint

    steps:
      - *checkout

      - *cache_spm

      - *resolve_packages

      - name: Unit Tests
        run: |
            xcodebuild test \
            -project HeadacheTracker.xcodeproj \
            -scheme HeadacheTracker \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -skipPackagePluginValidation \
            -only-testing:HeadacheTrackerTests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
  ui_tests:
    runs-on: macos-latest
    needs: unit_tests

    steps:
      - *checkout

      - *cache_spm

      - *resolve_packages

      - name: UI Tests
        run: |
            xcodebuild test \
            -project HeadacheTracker.xcodeproj \
            -scheme HeadacheTracker \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -skipPackagePluginValidation \
            -only-testing:HeadacheTrackerUITests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
